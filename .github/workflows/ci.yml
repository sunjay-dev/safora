name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint, Typecheck, and Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  integration:
    name: Containerized Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test runner
        run: docker compose -f docker-compose.test.yml build test-runner

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run containerized integration test suite
        run: docker compose -f docker-compose.test.yml run --rm test-runner

      - name: Tear down test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
