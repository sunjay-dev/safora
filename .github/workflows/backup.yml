name: Database Backup

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  MDBTOOLS_VERSION: "100.15.0"
  PG_MAJOR: "17"

jobs:
  check-mongodb:
    name: "Check: MONGODB_URI secret present"
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check secret
        id: check
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -n "$MONGODB_URI" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "MONGODB_URI secret is not set — skipping MongoDB backup job."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  check-postgres:
    name: "Check: POSTGRESQL_URI secret present"
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check secret
        id: check
        env:
          POSTGRESQL_URI: ${{ secrets.POSTGRESQL_URI }}
        run: |
          if [ -n "$POSTGRESQL_URI" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "POSTGRESQL_URI secret is not set — skipping PostgreSQL backup job."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  backup:
    name: Dump, encrypt, upload to S3
    needs: check-mongodb
    if: needs.check-mongodb.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install MongoDB Database Tools
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/mongodb-database-tools.deb \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${MDBTOOLS_VERSION}.deb"
          sudo apt-get install -y /tmp/mongodb-database-tools.deb
          mongodump --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Run backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_BLOCKLIST: ${{ vars.MONGODB_DB_BLOCKLIST || secrets.MONGODB_DB_BLOCKLIST }}
          DB_BLOCKLIST: ${{ vars.DB_BLOCKLIST || secrets.DB_BLOCKLIST }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || secrets.R2_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          S3_BUCKET: ${{ vars.S3_BUCKET || vars.R2_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX }}
          DUMP_TIMEOUT_MS: ${{ vars.DUMP_TIMEOUT_MS }}
          TOOL_CHECK_TIMEOUT_MS: ${{ vars.TOOL_CHECK_TIMEOUT_MS }}
          MAX_BUFFER: ${{ vars.MAX_BUFFER }}
        run: node dist/main.js

  postgres:
    name: "PostgreSQL: Dump, encrypt, upload to S3"
    needs: check-postgres
    if: needs.check-postgres.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PostgreSQL Client Tools
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
          # ubuntu-24.04 runners ship with postgresql-client-16 pre-installed;
          # the pg17 binaries land at /usr/lib/postgresql/17/bin/ but /usr/bin/pg_dump
          # still resolves to the older version. Prepend the versioned bin dir to PATH.
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${PG_MAJOR}/bin:$PATH"
          psql --version
          pg_dump --version
          pg_restore --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Run backup
        env:
          ENGINE: postgres
          POSTGRESQL_URI: ${{ secrets.POSTGRESQL_URI }}
          PG_DB_BLOCKLIST: ${{ vars.PG_DB_BLOCKLIST || secrets.PG_DB_BLOCKLIST }}
          DB_BLOCKLIST: ${{ vars.DB_BLOCKLIST || secrets.DB_BLOCKLIST }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || secrets.R2_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          S3_BUCKET: ${{ vars.S3_BUCKET || vars.R2_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX }}
          DUMP_TIMEOUT_MS: ${{ vars.DUMP_TIMEOUT_MS }}
          TOOL_CHECK_TIMEOUT_MS: ${{ vars.TOOL_CHECK_TIMEOUT_MS }}
          MAX_BUFFER: ${{ vars.MAX_BUFFER }}
        run: node dist/main.js
