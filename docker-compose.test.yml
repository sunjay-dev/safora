services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${TEST_MINIO_PORT:-9000}:9000"
      - "${TEST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/$${S3_BUCKET:-test-bucket} --ignore-existing && tail -f
      /dev/null "
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/$${S3_BUCKET:-test-bucket} || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "${TEST_MONGODB_PORT:-27017}:27017"
    volumes:
      - ./tests/fixtures/mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./tests/fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test-runner
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CI=true
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=test-bucket
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - MONGODB_URI=mongodb://mongodb:27017
      - POSTGRESQL_URI=postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      minio-init:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["pnpm", "test:integration"]

volumes:
  minio_data:
  mongo_data:
  postgres_data:
